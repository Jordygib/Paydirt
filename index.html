<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Paydirt – NFL touchdown & prop analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05080F; --surface:#0C1322; --surface2:#111A2D; --raise:#16213A;
  --ink:#EEF3FC; --muted:#94A1B9; --faint:#5F6B83; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.15);
  --accent:#FF6A2B; --accent2:#FFA14A; --accent-soft:rgba(255,106,43,.14); --glow:rgba(255,106,43,.5);
  --ice:#62A0FF; --ice-soft:rgba(98,160,255,.14); --turf:#34D27F; --turf-soft:rgba(52,210,127,.13);
  --track:rgba(255,255,255,.06); --tick:rgba(255,255,255,.10);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05080F}}
:root[data-theme="dark"]{--bg:#05080F}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#05080F}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--bg)}
/* animated background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg .orb{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform}
.bg .o1{width:640px;height:640px;left:-180px;top:-260px;background:rgba(255,106,43,.26);animation:drift1 26s ease-in-out infinite alternate}
.bg .o2{width:700px;height:700px;right:-240px;top:-200px;background:rgba(98,160,255,.20);animation:drift2 32s ease-in-out infinite alternate}
.bg .o3{width:520px;height:520px;left:35%;bottom:-300px;background:rgba(255,106,43,.14);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(220px,160px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-260px,220px) scale(.9)}}
@keyframes drift3{to{transform:translate(-200px,-140px) scale(1.2)}}
/* stadium floodlight beams */
.bg .beam{position:absolute;top:-20vh;width:70vw;height:150vh;transform-origin:50% 0;mix-blend-mode:screen;filter:blur(14px);
  -webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 80%);mask-image:linear-gradient(180deg,#000 10%,transparent 80%)}
.bg .b1{left:-20vw;background:conic-gradient(from 0deg at 50% 0%,transparent 168deg,rgba(255,160,100,.16) 177deg,rgba(255,190,140,.22) 180deg,rgba(255,160,100,.16) 183deg,transparent 192deg);animation:sway1 14s ease-in-out infinite alternate}
.bg .b2{right:-20vw;background:conic-gradient(from 0deg at 50% 0%,transparent 168deg,rgba(130,180,255,.14) 177deg,rgba(170,205,255,.20) 180deg,rgba(130,180,255,.14) 183deg,transparent 192deg);animation:sway2 17s ease-in-out infinite alternate}
@keyframes sway1{from{transform:rotate(-30deg)}to{transform:rotate(-10deg)}}
@keyframes sway2{from{transform:rotate(28deg)}to{transform:rotate(10deg)}}
/* receding turf grid */
.bg .floor{position:absolute;left:-50%;right:-50%;bottom:0;height:60vh;transform:perspective(600px) rotateX(58deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(255,255,255,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:100% 60px,90px 100%;animation:roll 3.2s linear infinite;
  -webkit-mask-image:linear-gradient(180deg,transparent 5%,#000 60%);mask-image:linear-gradient(180deg,transparent 5%,#000 60%)}
.bg .floor::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 40% 60% at 50% 100%,rgba(255,106,43,.16),transparent 70%)}
@keyframes roll{to{background-position:0 60px,0 0}}
/* drifting light specks */
.bg .dust{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#FFC9A3;box-shadow:0 0 8px 2px rgba(255,140,70,.6);opacity:0;animation:float var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes float{0%{transform:translate(0,0);opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate(var(--x),-105vh);opacity:0}}
.bg .spot{position:absolute;inset:0;background:radial-gradient(520px circle at var(--sx,50%) var(--sy,30%),rgba(255,140,70,.08),transparent 65%)}
.bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.5))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800}
.muted{color:var(--muted)} .small{font-size:14px;color:var(--muted)}

/* header + ticker */
header.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(5,8,15,.72);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:900;font-size:27px;letter-spacing:1.5px;line-height:1}
.brand svg{width:16px;height:28px;filter:drop-shadow(0 0 10px var(--glow))}
nav.main{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{position:relative;text-decoration:none;padding:8px 13px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:color .2s,background .2s}
nav.main a:hover{color:var(--ink);background:var(--surface2)}
nav.main a.on{color:var(--ink)}
nav.main a.on::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--glow)}
nav.main a .soon{font-size:11px;font-weight:700;color:var(--faint);margin-left:5px}
.ticker{border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .track{display:inline-flex;gap:34px;padding:8px 0;animation:tick 60s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{text-decoration:none;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.ticker a b{color:var(--ink);font-weight:600}
.ticker a span{font-family:var(--display);font-weight:800;font-size:17px;color:var(--accent)}
@keyframes tick{to{transform:translateX(-50%)}}
@media (max-width:760px){.bar{flex-wrap:wrap;gap:8px 14px}nav.main{order:3;width:100%;margin-left:0}}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:30px 22px 80px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1}
h1{font-size:clamp(44px,7vw,72px);font-weight:900}
h2{font-size:30px;font-weight:800;margin:48px 0 16px}
h3{font-size:22px;font-weight:800}
.lede{color:var(--muted);max-width:62ch;margin:10px 0 0;font-size:17px}
.sample{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:14px}
.sample i{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--glow);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* cards with cursor glow */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 40px -24px rgba(0,0,0,.8);transition:border-color .25s,transform .25s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(255,106,43,.10),transparent 60%)}
.card:hover::before{opacity:1}
a.card,.lift{text-decoration:none}
a.card:hover,.lift:hover{border-color:var(--line2);transform:translateY(-2px)}

/* reveal */
.rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* field bar */
.field{position:relative;height:10px;border-radius:999px;background:var(--track);min-width:100px}
.field::before{content:"";position:absolute;inset:0;border-radius:999px;background:repeating-linear-gradient(90deg,transparent 0 calc(9% - 1px),var(--tick) calc(9% - 1px) 9%)}
.field::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10%;border-radius:0 999px 999px 0;background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 8px);border-left:2px solid var(--accent)}
.field .run{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,rgba(52,210,127,.6),var(--turf) 45%,var(--accent2) 85%,var(--accent));transform-origin:left center;z-index:1;animation:drive 1s cubic-bezier(.2,.8,.2,1) both}
.field .ball{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent2) 35%,var(--accent) 70%);box-shadow:0 0 0 3px var(--surface),0 0 16px 2px var(--glow);z-index:2;animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
.field.lg{height:16px}
.field.lg .ball{width:22px;height:22px;margin:-11px 0 0 -11px}
@keyframes drive{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%,55%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.yards{position:relative;height:18px;margin-top:9px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--faint)}
.yards span{position:absolute;transform:translateX(-50%)}
.yards span.ez{color:var(--accent)}

/* ring gauge */
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--track)}
.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px}

/* avatar */
.av{position:relative;overflow:hidden;flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--tx);background:linear-gradient(150deg,var(--tc),var(--tc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.12),0 8px 18px -8px var(--tc)}
.av::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.10) .8px,transparent 1.1px) 0 0/4px 4px}
.av::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:5px;background:linear-gradient(currentColor 0 1.5px,transparent 1.5px 3.5px,currentColor 3.5px);opacity:.35}
.av .jn{position:relative;z-index:1;font-family:var(--display);font-weight:900;font-size:21px;line-height:1;margin-top:-4px;letter-spacing:-.5px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.shield{flex:none;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.mu .helmet{margin:0 -2px}
.av.lg{width:64px;height:64px;border-radius:18px}
.av.lg .jn{font-size:34px;margin-top:-6px}
.av.lg::after{bottom:9px;height:7px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .nm{font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm small{display:block;font-weight:500;color:var(--muted);font-size:13px}

/* top play */
.feature{display:block;margin-top:28px;padding:28px;overflow:hidden;background:radial-gradient(700px 300px at 100% 0%,rgba(255,106,43,.16),transparent 65%),var(--surface)}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px}
.f-main{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:18px 0 22px;flex-wrap:wrap}
.f-name{font-family:var(--display);font-weight:900;font-size:clamp(38px,6vw,62px);line-height:.95}
.f-meta{color:var(--muted);margin-top:6px}
.f-pct{font-family:var(--display);font-weight:900;font-size:clamp(80px,12vw,128px);line-height:.8;color:var(--accent);text-shadow:0 0 50px var(--glow)}
.f-pct small{font-size:.42em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.fact{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.fact b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.fact>span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.feature{padding:20px}.facts{gap:6px}.fact{padding:9px 10px}.fact b{font-size:21px}.fact span{font-size:12px}.yards span:nth-child(even):not(.ez){display:none}}

/* games list */
.glist{display:flex;flex-direction:column;gap:10px}
.gr{display:grid;grid-template-columns:86px 1fr 170px 160px;gap:18px;align-items:center;padding:16px 20px}
.gr .time{font-family:var(--display);font-weight:800;font-size:19px}
.gr .time small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.mu{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.mu i{width:5px;height:26px;border-radius:3px;background:var(--tc)}
.mu .at{font-size:16px;font-weight:700;color:var(--faint)}
.mu .pp{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.wxp{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.wxp svg{width:20px;height:20px;color:var(--muted);flex:none}
.wxp .hi{color:var(--accent)} .wxp .mid{color:var(--ice)}
.thr{text-align:right;font-size:13px;color:var(--muted);line-height:1.3}
.thr b{display:block;color:var(--ink);font-size:15px}
.thr em{font-style:normal;font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent)}
@media (max-width:760px){.gr{grid-template-columns:1fr 1fr;row-gap:12px}.gr .mu{grid-column:1/-1;order:-1;font-size:26px}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 16px}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.search{display:flex;align-items:center;gap:9px;flex:1 1 240px;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 13px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:rgba(255,106,43,.55);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 0}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{filter:invert(.7);cursor:pointer}
.nofx .rv{animation:none!important}
.cd-short{display:block;margin-top:5px;font-size:12px;font-weight:600;color:var(--accent2);white-space:nowrap}
.cd-clock{display:flex;gap:7px;justify-content:center;margin-top:6px}
.cd-unit{min-width:54px;padding:7px 6px 6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cd-unit b{display:block;font-family:var(--display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.cd-unit small{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-weight:600}
.cd-unit:last-child b{color:var(--accent);text-shadow:0 0 18px var(--glow)}
.live{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:#FF5A5A}
.live i{width:8px;height:8px;border-radius:50%;background:#FF5A5A;box-shadow:0 0 10px #FF5A5A;animation:pulse 1.2s ease-in-out infinite}
.cd-clock .live{font-family:var(--display);font-size:24px;padding:8px 14px;border-radius:12px;background:rgba(255,90,90,.12)}
.final{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.nextko{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:22px;padding:16px 22px;text-decoration:none;background:linear-gradient(90deg,rgba(255,106,43,.10),transparent 55%),var(--surface)}
.nk-l{display:flex;flex-direction:column;gap:4px}
.nk-t{font-size:13px;font-weight:700;color:var(--accent)}
.nk-m{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.nk-m .at{font-size:16px;color:var(--faint);font-weight:700}
.nextko .cd-clock{margin-top:0}
@media (max-width:600px){.cd-unit{min-width:46px}.cd-unit b{font-size:23px}.nk-m{font-size:24px}}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line2),0 4px 14px -6px var(--glow)}

/* expandable rows (TD + props) */
.list{display:flex;flex-direction:column;gap:10px}
.list details{border-radius:18px}
.list summary{list-style:none;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.td-row{display:grid;grid-template-columns:30px minmax(190px,1.2fr) minmax(160px,2fr) 70px;gap:18px;align-items:center;padding:14px 20px}
.rank{font-family:var(--display);font-weight:800;color:var(--faint);font-size:20px}
.pc{font-family:var(--display);font-weight:900;font-size:32px;text-align:right;line-height:1}
.pc.hot{color:var(--accent);text-shadow:0 0 24px var(--glow)}
.chev{transition:transform .25s;color:var(--faint)}
details[open] .chev{transform:rotate(180deg)}
.open{padding:2px 20px 22px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:9px 13px;min-width:118px}
.pill b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.pill span{font-size:12.5px;color:var(--muted)}
.pill.up b{color:var(--turf)} .pill.down b{color:var(--ice)}
.eq{margin-top:14px;font-size:14px;color:var(--muted)}
.eq code{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:var(--raise);padding:3px 8px;border-radius:8px}
@media (max-width:760px){.td-row{grid-template-columns:24px 1fr 60px;gap:10px 12px;padding:13px 14px}.td-row .fieldcell{grid-column:2/-1}.open{padding:2px 14px 18px}}

.pr-row{display:grid;grid-template-columns:minmax(190px,1.3fr) 1fr 110px 62px 34px 18px;gap:18px;align-items:center;padding:14px 20px}
.pr-stat{font-weight:600}
.pr-stat small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.proj{text-align:right;font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.proj small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.who .nm small.show-sm{display:none}
@media (max-width:760px){.who .nm small.show-sm{display:block;color:var(--ink)!important;font-weight:600!important;margin-top:2px}.pr-row{grid-template-columns:1fr 62px 18px;gap:10px 12px;padding:13px 14px}.pr-row .hide-sm{display:none}}

/* calculation chain */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-bottom:14px}
.step{background:var(--raise);border:1px solid var(--line);border-radius:13px;padding:9px 13px}
.step b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.step span{font-size:12.5px;color:var(--muted)}
.step.final{background:var(--accent-soft);border-color:rgba(255,106,43,.35)}
.step.final b{color:var(--accent)}

  if(g.wx.precip>=50) parts.push(`A ${g.wx.precip}% chance of rain makes ball security harder, so passing gets a small downgrade and the run game a small boost.`);

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

  const F=(label,v)=>r.factors.push({label,v});

    const share=p.tgt/c.basePass*trend, targets=c.passAtt*share;
    const catchR=clamp(p.rec/p.tgt*(1+(posAdj-1)*.5)*(c.g.wx.precip>=50?.97:1),.3,.92);

    F("Pace",c.plays/OFF[p.team][3]);F("Game script",(1-c.passRate)/(1-c.basePR/100));F(`${c.opp} run D`,rankAdj(d.rr));F(`${c.opp} vs ${p.pos}s`,dAdj);
    F("Weather",c.wxRush);F("Home field",c.homeAdj);F("Surface",c.turfAdj);F("Usage trend",trend);
  } else { // Passing yards
    const ypa=p.passYd/c.basePass*rankAdj(d.pr)*((d.wr+d.te)/2*.5+.5)*c.wxPass*c.homeAdj*(c.g.wx.indoor?1.02:1);
    r.avg=p.passYd;r.proj=c.passAtt*ypa;r.kind="yds";r.cv=CV.passYd;
    r.chain=[[f1(c.plays),"Projected plays"],[Math.round(c.passRate*100)+"%","Pass rate"],[f1(c.passAtt),"Pass attempts"],[f1(ypa),"Yards per attempt"],[Math.round(r.proj),"Passing yards"]];
    F("Pace",c.plays/OFF[p.team][3]);F("Game script",c.passRate/(c.basePR/100));F(`${c.opp} pass D`,rankAdj(d.pr));F(`${c.opp} vs receivers`,(d.wr+d.te)/2*.5+.5);

function searchBox(){return `<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search a player or team" value="${esc(query)}" autocomplete="off" spellcheck="false" aria-label="Search a player or team"></label>`}
const emptyMsg=()=>`<div class="card empty" style="padding:40px 20px">No players match “${esc(query)}”. Try a last name or a team like “Bills” or “KC”.</div>`;
function tdRow(x,i){const m=x.m;return `<details class="card ${rv()}"><summary class="td-row">
    <span class="rank">${i+1}</span>
    <span class="who">${av(x)}<span class="nm">${x.name}<small>${x.pos}, ${x.team} vs ${m.opp}${x.inj?", questionable":""}</small></span></span>
    <span class="fieldcell">${field(m.prob)}</span>
    <span class="pc ${m.prob>=.4?"hot":""}">${fmtPct(m.prob)}</span>
  </summary><div class="open">
    <div class="pills">
      <div class="pill"><b>${f1(m.pts)}</b><span>Projected team points</span></div>
      <div class="pill"><b>${f1(m.teamTD)}</b><span>Expected team TDs</span></div>
      <div class="pill"><b>${Math.round(x.share*100)}%</b><span>Share of team TD chances</span></div>
      <div class="pill ${pillCls(m.defAdj)}"><b>${mult(m.defAdj)}</b><span>${m.opp} defense vs ${x.pos}s</span></div>
      <div class="pill ${pillCls(m.wx)}"><b>${mult(m.wx)}</b><span>Weather</span></div>
      <div class="pill ${pillCls(m.form)}"><b>${mult(m.form)}</b><span>Usage trend</span></div>
      <div class="pill"><b>${x.td}</b><span>TDs this season</span></div>
      ${(PROPLINES[x.name]||{}).TD?(()=>{const b=PROPLINES[x.name].TD,ip=impl(b.price),e=m.prob-ip;return `<div class="pill"><b>${fmtOdds(b.price)}</b><span>Best odds (${b.book}), ${fmtPct(ip)} implied</span></div><div class="pill ${e>=0?"up":"down"}"><b>${e>=0?"+":""}${Math.round(e*100)}%</b><span>Model edge vs book</span></div>`})():""}
    </div>
    <div class="eq">${f1(m.teamTD)} × ${x.share.toFixed(2)} × ${m.defAdj.toFixed(2)} × ${m.wx.toFixed(2)} × ${m.form.toFixed(2)} = <code>${m.lam.toFixed(2)} expected TDs</code> = <code>${fmtPct(m.prob)}</code> chance to score. Rated ${tdLabel(m.prob).toLowerCase()}.</div>
  </div></details>`}
function tdList(){
  const list=ALL.filter(x=>(tdState.pos==="All"||x.pos===tdState.pos)&&matchQ(x));
  return list.length?list.map(tdRow).join(""):emptyMsg();
}
function viewTD(){
  return `<h1 class="${rv()}">Touchdown model</h1>
  <p class="lede ${rv()}">Each player's chance to score at least once. The closer the ball is to the end zone, the likelier the score. Tap any player for the math.</p>
  <div class="filters ${rv()}">${searchBox()}<div class="seg" id="posSeg">${["All","QB","RB","WR","TE"].map(p=>`<button data-pos="${p}" class="${tdState.pos===p?"on":""}">${p==="All"?"All":p}</button>`).join("")}</div></div>
  <div class="list" id="listBox" data-kind="td">${tdList()}</div>`;
}

let propState={stat:"All",sort:"chance"};
function rangeBar(r){
  const max=r.hi*1.08, pct=v=>clamp(v/max*100,0,100);
  return `<div class="range"><div class="rb"><div class="fill" style="left:${pct(r.lo)}%;width:${pct(r.hi)-pct(r.lo)}%"></div><div class="ln" style="left:${pct(r.line)}%" title="Season-average line"></div><div class="mk" style="left:${pct(r.proj)}%"></div></div>
  <div class="lbl"><span>Floor <b>${fmtVal(r.lo,r.kind)}</b></span><span>Avg line <b style="color:var(--accent2)">${r.line}</b></span><span>Projection <b>${fmtVal(r.proj,r.kind)}</b></span><span>Ceiling <b>${fmtVal(r.hi,r.kind)}</b></span></div></div>`;
}
function propRow(r){
  const chain=r.chain.map((s,i)=>`${i?'<span class="op">›</span>':""}<div class="step ${i===r.chain.length-1?"final":""}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
  return `<details class="card ${rv()}"><summary class="pr-row">
    <span class="who">${av(r.p)}<span class="nm">${r.p.name}<small>${r.p.pos}, ${r.p.team} vs ${r.c.opp}${r.p.inj?", questionable":""}</small><small class="show-sm">${r.stat}: ${fmtVal(r.proj,r.kind)} proj, avg ${fmtVal(r.avg,r.kind)}</small></span></span>
    <span class="pr-stat hide-sm">${r.stat}<small>${r.book?`Line ${r.line} (${r.book.book})`:`Season avg ${fmtVal(r.avg,r.kind)}`}</small></span>
    <span class="proj hide-sm">${fmtVal(r.proj,r.kind)}<small>${r.diff>=0?"+":""}${Math.round(r.diff*100)}% vs avg</small></span>
    ${ring(r.over)}
    <span class="hide-sm"><span class="grade g-${r.grade}">${r.grade}</span></span>
    ${chev}
  </summary><div class="open">
    <div class="chain">${chain}</div>
    <div class="pills">${r.factors.map(f=>`<div class="pill ${pillCls(f.v)}"><b>${mult(f.v)}</b><span>${f.label}</span></div>`).join("")}</div>
    ${rangeBar(r)}
    <div class="eq">The ring shows a <code>${fmtPct(r.over)}</code> chance he goes over ${r.line}, ${r.book?`the ${r.book.book} line (best over price ${fmtOdds(r.book.price)}, implied ${fmtPct(impl(r.book.price))}). Edge: <code>${(r.over-impl(r.book.price)>=0?"+":"")+Math.round((r.over-impl(r.book.price))*100)}%</code>.`:"the half-point line nearest his season average."} Projections use a ${r.kind==="count"?"Poisson":"normal"} distribution; the range covers the middle 80% of outcomes.</div>
  </div></details>`;
}
function propList(){
  let list=PROPS.filter(r=>(propState.stat==="All"||r.stat===propState.stat)&&matchQ(r.p));
  list=[...list].sort((a,b)=>propState.sort==="chance"?b.over-a.over:propState.sort==="boost"?b.diff-a.diff:a.over-b.over);
  return list.length?list.map(propRow).join(""):emptyMsg();
}
function viewProps(){
  const stats=["All","Passing yards","Rushing yards","Receptions","Receiving yards"];
  return `<h1 class="${rv()}">Player props</h1>
  <p class="lede ${rv()}">Every projection is built step by step: pace, game script, volume, efficiency, then defense, weather, venue, and role. The ring is his chance to go over the sportsbook line, or the line nearest his season average when no book line is posted. Tap a prop to see every step.</p>
  <div class="filters ${rv()}">
    ${searchBox()}
    <div class="seg" id="statSeg">${stats.map(s=>`<button data-stat="${s}" class="${propState.stat===s?"on":""}">${s==="All"?"All props":s}</button>`).join("")}</div>
    <div class="seg" id="sortSeg">${[["chance","Best chance"],["boost","Biggest boost"],["fade","Fades"]].map(([k,l])=>`<button data-sort="${k}" class="${propState.sort===k?"on":""}">${l}</button>`).join("")}</div>
  </div>
  <div class="list" id="listBox" data-kind="props">${propList()}</div>`;
}

function heatCell(v){
  const t=clamp((v-1)/.22,-1,1),pct=Math.round(Math.abs(t)*75),col=t>=0?"var(--accent)":"var(--ice)";
  return `<td class="heat"><span style="background:color-mix(in srgb,${col} ${pct}%,var(--surface2));color:${Math.abs(t)>.55?"#fff":"var(--ink)"}">${mult(v)}</span></td>`;
}
function defTable(teams){
  return `<div class="card scroll ${rv()}"><table>
  <thead><tr><th>Defense</th><th class="r">vs RB TDs</th><th class="r">vs WR TDs</th><th class="r">vs TE TDs</th><th class="r">QB rush TDs</th><th class="r">Pass yds rank</th><th class="r">Rush yds rank</th><th class="r">Red zone TD%</th></tr></thead>
  <tbody>${teams.map(t=>{const d=DEF[t];return `<tr><td><span class="tname">${shield(t,36)}${TEAMS[t].n}</span></td>${["rb","wr","te","qb"].map(k=>heatCell(d[k])).join("")}<td class="r num">${d.pr}</td><td class="r num">${d.rr}</td><td class="r num">${d.rz}%</td></tr>`}).join("")}</tbody></table></div>`;
}
function viewDefense(){
  const teams=Object.keys(DEF).sort((a,b)=>(DEF[b].rb+DEF[b].wr+DEF[b].te)-(DEF[a].rb+DEF[a].wr+DEF[a].te));
  return `<h1 class="${rv()}">Defenses</h1>
  <p class="lede ${rv()}">Touchdowns allowed to each position versus league average. Orange is a soft spot to attack, blue a defense to avoid. Yardage ranks run from 1 (stingiest) to 32.</p>
  <div style="margin-top:24px">${defTable(teams)}</div>`;
}

function viewGame(id){
  const g=GAMES.find(x=>x.id===id); if(!g) return `<div class="empty"><h1>Game not found</h1><p><a href="#/slate">Back to the slate</a></p></div>`;
  const im=wxImpact(g),pa=implied(g,g.away),ph=implied(g,g.home);
  const side=t=>`<div class="card mini ${rv()}"><div class="mh">${shield(t,40)}<h3>${TEAMS[t].n}</h3></div>${ALL.filter(x=>x.team===t).map(x=>`<div class="mr"><span class="who">${av(x)}<span class="nm">${x.name}<small>${x.pos}</small></span></span>${field(x.m.prob)}<span class="pc ${x.m.prob>=.4?"hot":""}">${fmtPct(x.m.prob)}</span></div>`).join("")}</div>`;
  const ca=teamCtx(g.away);
  const cond=[["stadium",g.st.name,g.st.city||g.st.roof],["grass",g.st.surface,g.st.roof.split(",")[0].split(" (")[0]],
    ["temp",g.wx.indoor?"72°F":g.wx.temp+"°F","Temperature"],["wind",g.wx.indoor?"0 mph":`${g.wx.wind} mph ${g.wx.dir}`,"Wind"],
    ["drop",g.wx.precip+"%","Rain chance"],["stadium",f1(ca.plays),"Projected plays per team"]];
  return `<a class="back" href="#/slate"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Slate</a>
  <div class="card gh ${rv()}"><div class="wash" style="--ca:${TEAMS[g.away].c};--ch:${TEAMS[g.home].c}"></div>
    <div class="gh-row">
      <div class="side-t">${shield(g.away,92)}<span class="ab">${g.away}</span><span class="full">${TEAMS[g.away].n}</span><span class="pt">${count(pa,1)}<small>projected</small></span></div>
      <div class="mid"><span class="k">${g.time}</span><span class="small">${g.day}</span><div class="chips">${g.ml&&g.ml[g.away]?`<span>${g.away} ${fmtOdds(g.ml[g.away].price)}</span><span>${g.home} ${fmtOdds(g.ml[g.home].price)}</span>`:""}<span>${g.home} ${g.spread>0?"+":""}${g.spread}</span><span>O/U ${g.total}</span><span class="${im.lvl}">${im.txt}</span></div>${cd(g,"clock")}</div>
      <div class="side-t h">${shield(g.home,92,true)}<span class="ab">${g.home}</span><span class="full">${TEAMS[g.home].n}</span><span class="pt">${count(ph,1)}<small>projected</small></span></div>
    </div>
  </div>
  <div class="cond">${cond.map(([i,b,s])=>`<div class="card ${rv()}">${icon(i)}<b>${b}</b><span>${s}</span></div>`).join("")}</div>
  <p class="note ${rv()}">${wxExplain(g)} ${g.st.note}</p>
  <h2 class="${rv()}">Touchdown chances</h2>
  <div class="cols2">${side(g.away)}${side(g.home)}</div>
  <h2 class="${rv()}">Player props</h2>
  <div class="list">${PROPS.filter(r=>r.c.g===g).sort((a,b)=>b.over-a.over).map(propRow).join("")}</div>
  <h2 class="${rv()}">Defenses</h2>
  ${defTable([g.away,g.home])}`;
}

function viewMethod(){
  return `<h1 class="${rv()}">How it works</h1>
  <p class="lede ${rv()}">Every number on Paydirt comes from a chain of simple, visible steps. Here's the math behind both models.</p>
  <h2 class="${rv()}">Touchdown model</h2>
  <div class="formula ${rv()}">Expected TDs = team TDs × player share × defense × weather × usage trend</div>
  <div class="formula ${rv()}">Chance to score = 1 − e<sup>−expected TDs</sup></div>
  <div class="steps">
    <div class="card ${rv()}"><h3>Team touchdowns</h3><p>Projected points from the spread and total, times about 0.105 touchdowns per point.</p></div>
    <div class="card ${rv()}"><h3>Player share</h3><p>His portion of team touchdown chances, weighted toward red-zone carries and targets.</p></div>
    <div class="card ${rv()}"><h3>Adjustments</h3><p>The opponent's touchdowns allowed to his position, wind and rain, and whether his role is growing.</p></div>
  </div>
  <h2 class="${rv()}">Prop model</h2>
  <div class="formula ${rv()}">Volume = plays × pass or run rate × target or carry share</div>
  <div class="formula ${rv()}">Projection = volume × efficiency × defense × weather × venue × role</div>
  <div class="steps">
    <div class="card ${rv()}"><h3>Pace</h3><p>Both teams' plays per game averaged, then nudged up for high totals and down for low ones.</p></div>
    <div class="card ${rv()}"><h3>Game script</h3><p>Underdogs throw more and favorites run more: each point of spread shifts pass rate about 0.6%.</p></div>
    <div class="card ${rv()}"><h3>Volume</h3><p>Team pass attempts or carries times the player's target or carry share, adjusted for his usage trend.</p></div>
    <div class="card ${rv()}"><h3>Efficiency</h3><p>Catch rate and yards per catch, carry, or attempt from his season, the core of each projection.</p></div>
    <div class="card ${rv()}"><h3>Defense</h3><p>The opponent's yardage rank (up to about 12% either way) plus how it defends his position.</p></div>
    <div class="card ${rv()}"><h3>Conditions</h3><p>Wind and rain for passing, a small home-field bump, a turf speed bump, and a dome boost for passers.</p></div>
  </div>
  <div class="formula ${rv()}">Chance to beat the line = P(outcome &gt; line)</div>
  <p class="note ${rv()}">Receptions use a Poisson distribution and yardage uses a normal distribution with a spread that fits each stat (passing yards are steadier than receiving yards). The floor and ceiling cover the middle 80% of outcomes. For now the line is the half-point nearest each player's season average; once sportsbook lines are connected, they'll replace it so you can see true value.</p>`;
}
function viewNBA(){return `<div class="empty"><h1 class="${rv()}">NBA is next</h1><p class="lede ${rv()}" data-x="1"><span style="display:block;margin:0 auto">The same approach (pace, usage, and defense vs position) will power points, rebounds, and assists projections.</span></p><p class="${rv()}"><a href="#/slate">Back to the NFL slate</a></p></div>`}

// ---------- Dynamics ----------
function animateCounts(){
  document.querySelectorAll("[data-to]").forEach(el=>{
    const to=+el.dataset.to,dec=+el.dataset.dec,suf=el.dataset.suf||"",t0=performance.now(),dur=900;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function animateRings(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>(root||document).querySelectorAll(".ring .fg[data-off]").forEach(c=>c.style.strokeDashoffset=c.dataset.off)));
}
const FOOTBALL='<svg viewBox="0 0 36 24" class="fb"><ellipse cx="18" cy="12" rx="17" ry="11" fill="#8A4B23"/><ellipse cx="18" cy="12" rx="17" ry="11" fill="none" stroke="#5E3015" stroke-width="1.5"/><path d="M5 6.5 Q7 12 5 17.5M31 6.5 Q29 12 31 17.5" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M12 12h12" stroke="#fff" stroke-width="1.8"/><path d="M14 9.5v5M16.7 9.5v5M19.3 9.5v5M22 9.5v5" stroke="#fff" stroke-width="1.4"/></svg>';
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x,y){
  if(reduce) return;
  const b=document.createElement("div");b.className="burst";b.style.transform=`translate(${x}px,${y}px)`;
  let html='<div class="ring2"></div>';
  const n=6;
  for(let i=0;i<n;i++){
    const a=(-90+(i-(n-1)/2)*34+(Math.random()*16-8))*Math.PI/180, dist=48+Math.random()*34;
    const dx=Math.cos(a)*dist, dy=Math.sin(a)*dist+18, r=(Math.random()*540-270)|0;
    html+=FOOTBALL.replace('class="fb"',`class="fb" style="--dx:${dx}px;--dy:${dy}px;--r:${r}deg;animation-delay:${i*18}ms"`);
  }
  b.innerHTML=html;document.body.appendChild(b);setTimeout(()=>b.remove(),900);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("a,button,summary");
  if(t) burst(e.clientX,e.clientY);
  const d=e.target.closest("details");
  if(d&&e.target.closest("summary")) setTimeout(()=>animateRings(d),20);
});
document.addEventListener("pointermove",e=>{
  const c=e.target.closest(".card"); if(!c) return;
  const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px");
});

// ---------- Router ----------
function render(){
  rvI=0;
  const h=location.hash.replace(/^#\/?/,"")||"slate";
  const [r,arg]=h.split("/");
  const views={slate:viewSlate,td:viewTD,props:viewProps,defense:viewDefense,method:viewMethod,nba:viewNBA,game:()=>viewGame(arg)};
  document.getElementById("app").innerHTML=(views[r]||viewSlate)();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r||(r==="game"&&a.dataset.r==="slate")||(!views[r]&&a.dataset.r==="slate")));
  animateCounts();animateRings();bind();tickCountdowns();
}
function bind(){
  const q=document.getElementById("q");
  if(q) q.oninput=()=>{
    query=q.value;
    const box=document.getElementById("listBox");
    box.classList.add("nofx");
    box.innerHTML=box.dataset.kind==="td"?tdList():propList();
    animateRings(box);
  };
  document.querySelectorAll("#posSeg button").forEach(b=>b.onclick=()=>{tdState.pos=b.dataset.pos;render()});
  document.querySelectorAll("#statSeg button").forEach(b=>b.onclick=()=>{propState.stat=b.dataset.stat;render()});
  document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=()=>{propState.sort=b.dataset.sort;render()});
}
(()=>{const d=document.getElementById("dust");let h="";for(let i=0;i<28;i++){const s=(Math.random()*2.2+1).toFixed(1);h+=`<span class="dust" style="left:${(Math.random()*100).toFixed(1)}%;--s:${s}px;--d:${(14+Math.random()*16).toFixed(1)}s;--dl:-${(Math.random()*30).toFixed(1)}s;--x:${(Math.random()*120-60)|0}px;--o:${(.25+Math.random()*.5).toFixed(2)}"></span>`}d.outerHTML=h})();
let spotRaf=0;document.addEventListener("pointermove",e=>{if(spotRaf)return;spotRaf=requestAnimationFrame(()=>{spotRaf=0;const r=document.documentElement.style;r.setProperty("--sx",e.clientX+"px");r.setProperty("--sy",e.clientY+"px")})});
async function loadLive(){
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),4000);
    let res=null;
    for(const url of ["data.json","https://jordygib.github.io/Paydirt/data.json"]){
      try{res=await fetch(url,{cache:"no-store",signal:ctl.signal});if(res.ok)break;}catch(e){res=null}
    }
    if(!res||!res.ok) return false;
    const d=await res.json();
    if(!d||!d.GAMES||!d.GAMES.length||!d.P||!d.P.length) return false;
    META=d.meta;TEAMS=d.TEAMS;OFF=d.OFF;DEF=d.DEF;GAMES=d.GAMES;P=d.P;PROPLINES=d.PROPLINES||{};NUM=Object.assign({},NUM,d.NUM||{});
    P=P.filter(p=>TEAMS[p.team]&&OFF[p.team]&&gameOf(p.team));
    return true;
  }catch(e){return false}
}
async function boot(){
  LIVE=await loadLive();
  ALL=P.map(p=>({...p,m:tdModel(p)})).sort((a,b)=>b.m.prob-a.m.prob);
  PROPS=P.flatMap(propsFor);
  document.getElementById("ticker").innerHTML=ticker();
  render();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
boot();
</script>
</body>
</html>
